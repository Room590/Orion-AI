<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Vanilla Workspace</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --accent: #0984e3;
            --border-radius: 12px;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- LAYOUT --- */
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        header {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent);
        }

        /* --- INTERACTIVE ELEMENTS --- */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        ul {
            list-style: none;
        }

        li {
            background: #f9f9f9;
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-state {
            text-align: center;
            color: #b2bec3;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Focus Dashboard</h1>
            <p id="date-display"></p>
        </header>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Enter a new goal...">
            <button id="addBtn">Add</button>
        </div>

        <ul id="taskList">
            </ul>
        
        <div id="emptyMsg" class="empty-state">No tasks for today. Start fresh!</div>
    </div>

    <script>
        // 1. Data & State
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const emptyMsg = document.getElementById('emptyMsg');
        const dateDisplay = document.getElementById('date-display');

        // 2. Set the current date
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        dateDisplay.innerText = new Date().toLocaleDateString(undefined, options);

        // 3. Logic Functions
        function addTask() {
            const text = taskInput.value.trim();
            
            if (text !== "") {
                // Hide empty message
                emptyMsg.style.display = 'none';

                // Create Element
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${text}</span>
                    <button style="background: #ff7675; padding: 5px 10px; font-size: 12px;" onclick="removeTask(this)">Delete</button>
                `;
                
                taskList.appendChild(li);
                taskInput.value = "";
                taskInput.focus();
            }
        }

        function removeTask(btn) {
            btn.parentElement.remove();
            if (taskList.children.length === 0) {
                emptyMsg.style.display = 'block';
            }
        }

        // 4. Event Listeners
        addBtn.addEventListener('click', addTask);

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Log to confirm script execution
        console.log("App initialized successfully. No imports detected.");
    </script>
</body>
</html>
